# Cost model — Phase 2 locked decision 2: TWO labelled numbers per cell, never 0.0.
#
#   api_usd_per_1m — token counts × these rates. This is a PROXY: it prices each open-weight
#                    model as if it were commercially served, so "faithfulness per dollar" is
#                    comparable to API-priced baselines (EvaRAG prices its SQuAD runs this way).
#                    It is NOT what the experiment cost.
#   gpu_usd_per_hour — measured wall-clock × this rate. This IS what the experiment cost, and it
#                    is the honest number for local/colab hardware.
#
# !!! VERIFY BEFORE REPORTING !!!
# The api rates below are plausible hosted list prices, NOT verified against any provider page.
# `verified: false` is carried into the scorecard, so a stale rate is visible in the published
# artifact rather than buried in a config file. Set it to true and record provider + retrieval
# date in `source` once checked. A benchmark that reports unverified prices as measurements is
# worse than one that reports no price at all.

version: 2026-09-29-unverified
gpu_usd_per_hour: 0.35       # T4-class rented GPU. Adjust to what you actually paid. For free
                              # Colab T4 pass a nominal 0.0 WITH a note — never a silent 0.

providers:
