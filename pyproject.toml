[project]
name = "slm-rag-bench"
version = "0.1.0"
description = "Cost-Latency-Faithfulness benchmark for small-model RAG (Blueprint 2, GAP 5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    # The fixed retriever's sparse arm. numpy/scipy only, no JVM — the pyserini path it
    # replaced needed JDK 17 and could not even be measured on a machine without it.
    "bm25s>=0.3",
    # HotpotQA ingestion. The raw JSON hosts (curtis.ml.cmu.edu, github.com/hotpotqa) are DEAD
    # as of 2026-09-29 — probed, see Notes/Phase 2 Plan.md pre-flight finding 1 — so the HF Hub
    # copy is the only live route. Imported lazily inside load_split() to keep the CPU-only
    # modules importable without it.
    "datasets>=4.0",
]

[project.optional-dependencies]
# vLLM serving (AWQ kernels) + instructor + OpenAI client for the judge path.
serve = ["vllm>=0.6", "instructor>=1.0", "openai>=1.0", "ragas>=0.4.3"]
# Reference-free metrics via the PyPI collections API. 0.4.3 verified against the wheel:
# metrics.collections + llm_factory(client=) + embeddings.HuggingFaceEmbeddings, and the
# instructor-only _validate_llm guard the local-judge path depends on. (langchain-huggingface
# is NOT used; litellm/datasets are not needed — ragas pulls datasets, openai+instructor serve
# the judge.)
eval = ["ragas>=0.4.3"]
